<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17322e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Para ti">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Feliz Día de la Novia</title>

<style>
  :root {
    color-scheme: dark;
    --night: #111612;
    --forest: #17322e;
    --wine: #3a2025;
    --paper: #fff1d8;
    --paper-ink: #34231f;
    --ink: #f8efe1;
    --muted: #d4c4ae;
    --rose: #e96c78;
    --rose-deep: #b84255;
    --gold: #f1b35e;
    --mint: #91d2c2;
    --teal: #2e7a75;
    --shadow: rgba(0, 0, 0, 0.32);
    --panel: rgba(255, 241, 216, 0.09);
    --line: rgba(255, 241, 216, 0.22);
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    min-width: 320px;
    background:
      linear-gradient(145deg, rgba(46, 122, 117, 0.28), transparent 38%),
      linear-gradient(320deg, rgba(184, 66, 85, 0.28), transparent 42%),
      linear-gradient(180deg, var(--night), var(--forest) 56%, var(--wine));
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
    overflow-x: hidden;
  }

  button,
  input {
    font: inherit;
  }

  button {
    min-height: 44px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(255, 241, 216, 0.11);
    color: var(--ink);
    padding: 0.78rem 1rem;
    cursor: pointer;
    touch-action: manipulation;
  }

  button:focus-visible,
  a:focus-visible {
    outline: 3px solid var(--mint);
    outline-offset: 3px;
  }

  button:active {
    transform: translateY(1px);
  }

  .primary {
    border-color: transparent;
    background: linear-gradient(135deg, var(--gold), var(--rose));
    color: #24120f;
    font-weight: 700;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.26);
  }

  .ghost {
    background: transparent;
  }

  .app {
    position: relative;
    isolation: isolate;
    min-height: 100svh;
  }

  .sky {
    position: absolute;
    inset: 0 0 auto;
    height: min(66rem, 130svh);
    overflow: hidden;
    pointer-events: none;
    z-index: -2;
  }

  .star,
  .heart {
    position: absolute;
    display: block;
    opacity: 0.72;
    transform-origin: center;
  }

  .star {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--paper);
    box-shadow: 0 0 10px rgba(255, 241, 216, 0.85);
    animation: twinkle 4.6s ease-in-out infinite;
  }

  .heart {
    width: 12px;
    height: 12px;
    color: rgba(233, 108, 120, 0.64);
    animation: drift 9s ease-in-out infinite;
  }

  .heart::before,
  .heart::after {
    content: "";
    position: absolute;
    width: 7px;
    height: 11px;
    border-radius: 7px 7px 0 0;
    background: currentColor;
  }

  .heart::before {
    left: 6px;
    transform: rotate(-45deg);
    transform-origin: 0 100%;
  }

  .heart::after {
    left: 0;
    transform: rotate(45deg);
    transform-origin: 100% 100%;
  }

  @keyframes twinkle {
    0%,
    100% {
      opacity: 0.2;
      transform: scale(0.75);
    }

    45% {
      opacity: 0.9;
      transform: scale(1.08);
    }
  }

  @keyframes drift {
    0%,
    100% {
      transform: translate3d(0, 0, 0) rotate(-8deg);
    }

    50% {
      transform: translate3d(16px, -26px, 0) rotate(10deg);
    }
  }

  .wrap {
    width: min(100%, 46rem);
    margin: 0 auto;
    padding: max(1rem, env(safe-area-inset-top)) 1rem max(2rem, env(safe-area-inset-bottom));
  }

  .hero {
    min-height: 96svh;
    display: grid;
    align-content: start;
    gap: 1.1rem;
    padding: 1.25rem 0 10svh;
  }

  .eyebrow {
    margin: 0;
    color: var(--gold);
    font-size: 0.86rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  h1,
  h2,
  h3,
  p {
    margin-top: 0;
  }

  h1 {
    max-width: 12ch;
    margin-bottom: 0;
    font-size: clamp(2.55rem, 11vw, 5.3rem);
    line-height: 0.95;
    letter-spacing: 0;
  }

  h2 {
    margin-bottom: 0.75rem;
    font-size: clamp(1.65rem, 6vw, 2.5rem);
    line-height: 1.05;
    letter-spacing: 0;
  }

  h3 {
    margin-bottom: 0.4rem;
    font-size: 1.05rem;
    letter-spacing: 0;
  }

  .lead {
    max-width: 34rem;
    margin-bottom: 0;
    color: var(--muted);
    font-size: clamp(1.03rem, 3.5vw, 1.25rem);
  }

  .hero-actions,
  .button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.7rem;
    align-items: center;
  }

  .hero-actions button,
  .button-row button,
  .button-row a {
    flex: 1 1 11rem;
  }

  .button-row a {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.78rem 1rem;
    color: var(--ink);
    text-decoration: none;
  }

  .scene-card {
    position: relative;
    display: grid;
    min-height: 18rem;
    place-items: center;
    padding: 1rem 0;
  }

  .moon-scene {
    width: min(100%, 25rem);
    filter: drop-shadow(0 26px 36px rgba(0, 0, 0, 0.28));
  }

  .envelope-lid {
    transform-origin: 200px 166px;
    transition: transform 800ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .opened .envelope-lid {
    transform: rotateX(72deg) translateY(-18px);
  }

  .opened .letter-peek {
    animation: letterRise 820ms 130ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }

  @keyframes letterRise {
    to {
      transform: translateY(-34px);
    }
  }

  .hint {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }

  .scroll-hint {
    align-self: end;
    color: rgba(255, 241, 216, 0.66);
    font-size: 0.9rem;
  }

  section {
    padding: 3rem 0;
  }

  .letter {
    border: 1px solid rgba(52, 35, 31, 0.16);
    border-radius: 8px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.42), transparent 44%),
      var(--paper);
    color: var(--paper-ink);
    padding: clamp(1.15rem, 5vw, 2rem);
    box-shadow: 0 24px 50px var(--shadow);
  }

  .letter p {
    margin-bottom: 1rem;
  }

  .signature {
    margin-bottom: 0;
    color: #5a3831;
    font-weight: 700;
  }

  .countdown {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0.65rem;
    margin-top: 1rem;
  }

  .timebox,
  .memory-card,
  .promise-card,
  .scratch {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
  }

  .timebox {
    min-width: 0;
    padding: 0.85rem 0.35rem;
    text-align: center;
  }

  .timebox strong {
    display: block;
    font-variant-numeric: tabular-nums;
    font-size: clamp(1.35rem, 8vw, 2.4rem);
    line-height: 1;
  }

  .timebox span {
    display: block;
    margin-top: 0.35rem;
    color: var(--muted);
    font-size: 0.75rem;
  }

  .memory-grid,
  .promise-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.8rem;
    margin-top: 1rem;
  }

  .memory-card,
  .promise-card {
    min-height: 9rem;
    padding: 1rem;
  }

  .memory-card {
    display: grid;
    gap: 0.55rem;
    align-content: start;
  }

  .memory-card button {
    justify-self: start;
    min-height: 38px;
    padding: 0.42rem 0.7rem;
    font-size: 0.92rem;
  }

  .memory-card p,
  .promise-card p {
    margin-bottom: 0;
    color: var(--muted);
  }

  .memory-card .revealed {
    color: var(--ink);
  }

  .promise-card strong {
    display: block;
    color: var(--gold);
    font-size: 1.02rem;
  }

  .scratch {
    position: relative;
    min-height: 15rem;
    overflow: hidden;
    margin-top: 1rem;
  }

  .scratch-prize {
    min-height: 15rem;
    display: grid;
    place-items: center;
    padding: 0.7rem;
    text-align: center;
  }

  .scratch-prize figure {
    margin: 0;
  }

  .scratch-photo {
    width: 100%;
    max-height: 24rem;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.26);
  }

  .scratch-caption {
    margin: 0.75rem 0 0;
    color: var(--muted);
    font-weight: 700;
  }

  #scratchCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  .toast {
    position: fixed;
    left: 1rem;
    right: 1rem;
    bottom: max(1rem, env(safe-area-inset-bottom));
    z-index: 5;
    max-width: 28rem;
    margin: 0 auto;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(17, 22, 18, 0.92);
    color: var(--ink);
    padding: 0.85rem 1rem;
    box-shadow: 0 18px 48px var(--shadow);
    opacity: 0;
    pointer-events: none;
    transform: translateY(1rem);
    transition: opacity 220ms ease, transform 220ms ease;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  .hidden {
    display: none !important;
  }

  @media (max-width: 560px) {
    .wrap {
      padding-inline: 0.9rem;
    }

    .hero {
      min-height: 94svh;
      padding-top: 1rem;
    }

    .scene-card {
      min-height: 15.5rem;
    }

    .countdown {
      gap: 0.45rem;
    }

    .timebox {
      padding-inline: 0.2rem;
    }

    .memory-grid,
    .promise-grid {
      grid-template-columns: 1fr;
    }

    .hero-actions button,
    .button-row button,
    .button-row a {
      flex-basis: 100%;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>

<body>

<main class="app" id="giftApp">
  <div class="sky" id="sky" aria-hidden="true"></div>

  <div class="wrap">
    <section class="hero" id="inicio">
      <p class="eyebrow" id="eyebrowText"></p>
      <h1 id="heroTitle"></h1>
      <p class="lead" id="heroLead"></p>

      <div class="scene-card" aria-hidden="true">
        <svg class="moon-scene" viewBox="0 0 400 320" role="img">
          <defs>
            <linearGradient id="paperGradient" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="#fff7df" />
              <stop offset="1" stop-color="#f1b35e" />
            </linearGradient>
            <linearGradient id="envelopeGradient" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="#ffdca1" />
              <stop offset="1" stop-color="#e96c78" />
            </linearGradient>
            <linearGradient id="tableGradient" x1="0" x2="1">
              <stop offset="0" stop-color="#244943" />
              <stop offset="1" stop-color="#6d3038" />
            </linearGradient>
          </defs>

          <circle cx="308" cy="67" r="38" fill="#fff1d8" opacity="0.9" />
          <path d="M294 34c-7 16-2 35 13 45 9 6 20 8 31 5-8 13-23 21-40 20-21-2-38-20-38-42 0-15 8-28 20-35 4-2 9 1 14 7Z" fill="#17322e" opacity="0.82" />

          <path d="M44 238c40-28 73-33 104-16 21 12 44 12 70-1 46-24 87-18 138 19v57H44v-59Z" fill="#17322e" opacity="0.82" />
          <path d="M53 254c42-19 79-20 111-3 24 13 51 12 83-5 38-20 73-16 107 11v45H53v-48Z" fill="#0f2a27" opacity="0.82" />

          <ellipse cx="201" cy="274" rx="142" ry="18" fill="#080b09" opacity="0.28" />
          <path d="M80 240c60-30 178-30 240 0l-18 45H98l-18-45Z" fill="url(#tableGradient)" />
          <path d="M100 241c52 17 150 17 202 0" fill="none" stroke="#fff1d8" stroke-opacity="0.17" stroke-width="3" stroke-linecap="round" />

          <g class="letter-peek" style="transform: translateY(0)">
            <rect x="142" y="132" width="118" height="94" rx="6" fill="#fff1d8" />
            <path d="M159 156h82M159 176h68M159 196h50" stroke="#b84255" stroke-width="5" stroke-linecap="round" opacity="0.38" />
          </g>

          <g>
            <path d="M112 171h176v92a8 8 0 0 1-8 8H120a8 8 0 0 1-8-8v-92Z" fill="url(#envelopeGradient)" />
            <path d="M116 175l84 61 84-61v88H116v-88Z" fill="#d95e6d" opacity="0.82" />
            <path d="M116 263l61-57 23 17 23-17 61 57H116Z" fill="#f1b35e" opacity="0.9" />
            <path class="envelope-lid" d="M112 171l88 66 88-66-78-41a22 22 0 0 0-20 0l-78 41Z" fill="url(#paperGradient)" />
            <circle cx="200" cy="224" r="17" fill="#b84255" />
            <path d="M200 236c-19-12-28-21-28-31 0-8 6-13 13-13 6 0 11 4 15 10 4-6 9-10 15-10 7 0 13 5 13 13 0 10-9 19-28 31Z" fill="#fff1d8" />
          </g>

          <g opacity="0.86">
            <path d="M76 156c28-14 54-13 78 1" fill="none" stroke="#91d2c2" stroke-width="4" stroke-linecap="round" opacity="0.42" />
            <path d="M252 139c21-10 41-9 59 2" fill="none" stroke="#f1b35e" stroke-width="4" stroke-linecap="round" opacity="0.36" />
            <path d="M63 112h42M312 190h37" stroke="#fff1d8" stroke-width="3" stroke-linecap="round" opacity="0.3" />
          </g>
        </svg>
      </div>

      <div class="hero-actions">
        <button class="primary" type="button" id="openGift">Abrir mi regalo</button>
        <button class="ghost" type="button" id="playMagic">Encender sorpresa</button>
      </div>
      <p class="hint" id="hintText"></p>
      <p class="scroll-hint">Después de abrir, baja un poquito.</p>
    </section>

    <section id="carta" class="hidden">
      <div class="letter">
        <p id="letterOne"></p>
        <p id="letterTwo"></p>
        <p id="letterThree"></p>
        <p class="signature" id="signature"></p>
      </div>
    </section>

    <section id="reencuentro" class="hidden" aria-labelledby="countdownTitle">
      <p class="eyebrow">Cuenta atras</p>
      <h2 id="countdownTitle"></h2>
      <p class="lead" id="countdownLead"></p>
      <div class="countdown" aria-live="polite">
        <div class="timebox"><strong id="days">0</strong><span>días</span></div>
        <div class="timebox"><strong id="hours">0</strong><span>horas</span></div>
        <div class="timebox"><strong id="minutes">0</strong><span>min</span></div>
        <div class="timebox"><strong id="seconds">0</strong><span>seg</span></div>
      </div>
    </section>

    <section id="vale" class="hidden" aria-labelledby="scratchTitle">
      <p class="eyebrow">Foto sorpresa</p>
      <h2 id="scratchTitle"></h2>
      <p class="lead" id="scratchLead"></p>
      <div class="scratch">
        <div class="scratch-prize">
          <figure>
            <img class="scratch-photo" id="scratchPhoto" src="" alt="">
            <figcaption class="scratch-caption" id="scratchCaption"></figcaption>
          </figure>
        </div>
        <canvas id="scratchCanvas" aria-label="Rasca para descubrir la foto"></canvas>
      </div>
      <div class="button-row" style="margin-top: 0.8rem">
        <button type="button" id="revealCoupon">Revelar foto</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>

<script>
  /*
    Personaliza aquí:
    - Cambia nombres, textos y fecha del reencuentro.
    - Si tienes una playlist, pega su enlace en playlistUrl.
    - Si quieres botón de WhatsApp, pon el número con prefijo país, sin + ni espacios.
  */
  const regalo = {
    nombreElla: "mi amor",
    nombreTu: "yo",
    playlistUrl: "",
    diaRegalo: "1 de agosto",
    fechaReencuentro: "2026-08-03T20:00:00+01:00",
    encabezado: "Para ti, bebé",
    titulo: "Feliz Día de la Novia",
    subtitulo: "No me iba a olvidar de hacerte algo, aunque estemos lejos.",
    pista: "Hecho para abrir despacio, con una sonrisa y sin prisa.",
    carta: [
      "Hoy quería felicitarte, mi amorcito, de alguna manera por ser la mejor novia del mundo y por hacerme el niño más feliz.",
      "Tengo millones de ganas de darte besitos y abrazos infinitos, y de no soltarte nuuunncaaaa.",
      "Esta semana se me está haciendo muyy muy larga, mi amor, pero aun así mi amor por ti sigue creciendo cada día 6 millones más."
    ],
    fotoRasca: "foto-sorpresa.jpg",
    fotoAlt: "Una foto nuestra",
    fotoPie: "Porque esta foto también tenía que estar aquí."
  };

  const app = document.getElementById("giftApp");
  const sky = document.getElementById("sky");
  const sections = ["carta", "reencuentro", "vale"].map((id) => document.getElementById(id));
  const toast = document.getElementById("toast");
  const qs = (selector) => document.querySelector(selector);
  let resizeScratchCanvas = () => {};

  function setText(id, value) {
    const node = document.getElementById(id);
    if (node) node.textContent = value;
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    window.clearTimeout(showToast.timer);
    showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2400);
  }

  function fillCopy() {
    setText("eyebrowText", regalo.encabezado);
    setText("heroTitle", regalo.titulo);
    setText("heroLead", regalo.subtitulo);
    setText("hintText", regalo.pista);
    setText("letterOne", regalo.carta[0]);
    setText("letterTwo", regalo.carta[1]);
    setText("letterThree", regalo.carta[2]);
    setText("signature", `Con todo mi cariño, ${regalo.nombreTu}.`);
    setText("countdownTitle", `Nos vemos el día 3`);
    setText("countdownLead", `Cada número de aquí es una excusa menos para volver a abrazarte, ${regalo.nombreElla}.`);
    setText("scratchTitle", "Rasca para verla");
    setText("scratchLead", "Una foto escondida para ti.");
    setText("scratchCaption", regalo.fotoPie);

    const scratchPhoto = document.getElementById("scratchPhoto");
    scratchPhoto.src = regalo.fotoRasca;
    scratchPhoto.alt = regalo.fotoAlt;
    scratchPhoto.onerror = () => {
      scratchPhoto.removeAttribute("src");
      scratchPhoto.alt = "";
      scratchPhoto.style.display = "none";
      setText("scratchCaption", "Pon tu foto al lado de este archivo con el nombre foto-sorpresa.jpg y aparecerá aquí.");
    };

  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function buildSky() {
    const starPositions = [
      [7, 9, 0], [18, 18, 1.1], [31, 8, 2.1], [44, 19, 0.4], [58, 11, 1.7],
      [71, 21, 0.7], [86, 12, 2.5], [94, 29, 1.3], [11, 39, 1.8], [25, 31, 0.2],
      [40, 42, 2.9], [64, 34, 0.9], [79, 46, 2.2], [91, 53, 0.5], [16, 62, 2.7],
      [37, 57, 1.4], [53, 66, 0.1], [69, 59, 1.9], [84, 72, 2.8], [6, 78, 0.8]
    ];

    starPositions.forEach(([left, top, delay]) => {
      const star = document.createElement("span");
      star.className = "star";
      star.style.left = `${left}%`;
      star.style.top = `${top}%`;
      star.style.animationDelay = `${delay}s`;
      sky.appendChild(star);
    });

    [[13, 81, 0], [73, 82, 1.8], [88, 65, 3.2], [27, 72, 4.1]].forEach(([left, top, delay]) => {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.style.left = `${left}%`;
      heart.style.top = `${top}%`;
      heart.style.animationDelay = `${delay}s`;
      sky.appendChild(heart);
    });
  }

  function openGift() {
    app.classList.add("opened");
    sections.forEach((section) => section.classList.remove("hidden"));
    document.getElementById("openGift").textContent = "Abierto";
    document.getElementById("openGift").disabled = true;
    window.setTimeout(resizeScratchCanvas, 60);
    floatHearts(18);
    window.setTimeout(() => document.getElementById("carta").scrollIntoView({ behavior: "smooth", block: "start" }), 540);
  }

  function floatHearts(amount) {
    for (let index = 0; index < amount; index += 1) {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.style.position = "fixed";
      heart.style.left = `${18 + Math.random() * 64}%`;
      heart.style.top = `${70 + Math.random() * 18}%`;
      heart.style.color = index % 3 === 0 ? "rgba(241, 179, 94, 0.72)" : "rgba(233, 108, 120, 0.72)";
      heart.style.zIndex = "4";
      heart.style.animation = `popHeart ${900 + Math.random() * 600}ms ease-out forwards`;
      document.body.appendChild(heart);
      window.setTimeout(() => heart.remove(), 1700);
    }
  }

  const style = document.createElement("style");
  style.textContent = `
    @keyframes popHeart {
      0% { opacity: 0; transform: translate3d(0, 14px, 0) scale(0.72) rotate(-8deg); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate3d(0, -92px, 0) scale(1.18) rotate(12deg); }
    }
  `;
  document.head.appendChild(style);

  function updateCountdown() {
    const target = new Date(regalo.fechaReencuentro).getTime();
    const now = Date.now();
    let remaining = Math.max(0, target - now);
    const day = 24 * 60 * 60 * 1000;
    const hour = 60 * 60 * 1000;
    const minute = 60 * 1000;

    const days = Math.floor(remaining / day);
    remaining -= days * day;
    const hours = Math.floor(remaining / hour);
    remaining -= hours * hour;
    const minutes = Math.floor(remaining / minute);
    remaining -= minutes * minute;
    const seconds = Math.floor(remaining / 1000);

    setText("days", days);
    setText("hours", String(hours).padStart(2, "0"));
    setText("minutes", String(minutes).padStart(2, "0"));
    setText("seconds", String(seconds).padStart(2, "0"));

    if (target <= now) {
      setText("countdownTitle", "Hoy toca verte");
      setText("countdownLead", "La distancia ya hizo su parte. Ahora toca el abrazo.");
    }
  }

  function setupScratch() {
    const canvas = document.getElementById("scratchCanvas");
    const revealButton = document.getElementById("revealCoupon");
    const context = canvas.getContext("2d");
    let drawing = false;
    let scratched = 0;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = Math.floor(rect.width * ratio);
      canvas.height = Math.floor(rect.height * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      paintCover(rect.width, rect.height);
    }

    function paintCover(width, height) {
      const gradient = context.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0, "#244943");
      gradient.addColorStop(0.48, "#b84255");
      gradient.addColorStop(1, "#f1b35e");
      context.globalCompositeOperation = "source-over";
      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);
      context.fillStyle = "rgba(255, 241, 216, 0.92)";
      context.font = "700 22px system-ui, sans-serif";
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.fillText("Rasca aquí", width / 2, height / 2 - 12);
      context.font = "500 14px system-ui, sans-serif";
      context.fillText("o toca el botón de abajo", width / 2, height / 2 + 22);
    }

    function scratch(event) {
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      const pointer = event.touches ? event.touches[0] : event;
      const x = pointer.clientX - rect.left;
      const y = pointer.clientY - rect.top;
      context.globalCompositeOperation = "destination-out";
      context.beginPath();
      context.arc(x, y, 22, 0, Math.PI * 2);
      context.fill();
      scratched += 1;
      if (scratched > 16) {
        canvas.style.opacity = "0";
        canvas.style.pointerEvents = "none";
        revealButton.classList.add("hidden");
        floatHearts(10);
      }
    }

    canvas.addEventListener("pointerdown", (event) => {
      drawing = true;
      scratch(event);
    });
    canvas.addEventListener("pointermove", scratch);
    canvas.addEventListener("pointerup", () => { drawing = false; });
    canvas.addEventListener("pointercancel", () => { drawing = false; });
    window.addEventListener("resize", resize);
    resizeScratchCanvas = resize;
    resize();

    document.getElementById("revealCoupon").addEventListener("click", () => {
      canvas.style.opacity = "0";
      canvas.style.pointerEvents = "none";
      revealButton.classList.add("hidden");
      floatHearts(10);
    });
  }

  fillCopy();
  buildSky();
  updateCountdown();
  setupScratch();
  window.setInterval(updateCountdown, 1000);

  document.getElementById("openGift").addEventListener("click", openGift);
  document.getElementById("playMagic").addEventListener("click", () => {
    floatHearts(14);
    showToast("Sorpresa encendida.");
  });

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  }
</script>
</body>
